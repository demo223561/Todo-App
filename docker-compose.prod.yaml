services:
  frontend:
    image: <你的Docker Hub帳號>/todo-frontend:v1.0.0
    ports:
      - "3000:80"
    environment:
      API_HOST: api
      API_PORT: "8000"
    depends_on:
      - api

  api:
    image: <你的Docker Hub帳號>/todo-app-api:v1.0.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mysql:8.0
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
